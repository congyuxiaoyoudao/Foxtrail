<text x="72" y="1058" class="foot">交付提示：每组过渡图各占 1 格宽；左右边缘分别接原主题与新主题，中间接缝共用天空色、轮廓高度和地表色。</text>
<text x="72" y="1086" class="foot">反向路线按相同结构制作或在构图允许时镜像复用；雪山↔沙漠虽然当前规则不相邻，仍列作素材预留。</text>
